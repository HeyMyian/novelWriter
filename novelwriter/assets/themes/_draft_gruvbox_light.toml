[Main]
name = "Gruvbox-Light"
mode = "light"
author = "sobjey9"
credit = "Pavel Pertsev"
url = "https://github.com/morhetz/gruvbox"

[Base]
base = "#fbf1c7"
default = "#3c3836"
faded = "#928374"
red = "#9d0006"
orange = "#af3a03"
yellow = "#b57614"
green = "#79740e"
cyan = "#427b58"
blue = "#076678"
purple = "#8f3f71"

[Project]
root = "default"
folder = "red"
file = "default"
title = "cyan"
chapter = "purple"
scene = "#d65d0e"
note = "yellow"
active = "cyan"
inactive = "red"
disabled = "faded"

[Icon]
tool = "default"
sidebar = "default"
accept = "cyan"
reject = "red"
action = "blue"
option = "yellow"
apply = "cyan"
create = "yellow"
destroy = "faded"
reset = "cyan"
add = "cyan"
change = "cyan"
remove = "red"
shortcode = "yellow"
markdown = "default"
system = "yellow"
info = "blue"
warning = "yellow"
error = "red"

[Palette]
window = "#ebdbb2" #"#eee8d5"
windowText = "default"
base = "base"
alternateBase = "#ebdbb2"
text = "default"
tooltipBase = "#ebdbb2"
tooltipText = "default"
button = "base"
buttonText = "default"
brightText = "base"
highlight = "#b16286"
highlightedText = "base"
link = "blue"
linkVisited = "blue"
accent = "#b16286"

[GUI]
helpText = "faded:D125"
fadedText = "faded"
errorText = "red"
accentText = "cyan"
activeButton = "purple:96"
activeBase = "base"
searchMatch = "yellow:80"

[Syntax]
background = "base"
text = "default"
line = "#ebdbb2" #"#eee8d5"
link = "blue"
headerText = "cyan"
headerTag = "cyan:128"
emphasis = "purple"
whitespace = "purple:64"
dialog = "cyan:D105"
altDialog = "blue"
note = "yellow"
hidden = "faded"
shortcode = "yellow"
keyword = "#d65d0e"
tag = "yellow"
value = "faded"
optional = "faded"
spellCheckLine = "red"
errorLine = "blue"
replaceTag = "yellow"
modifier = "red"
textHighlight = "#d5c4a1"

